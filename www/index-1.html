<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15132b">
<title>O Narrador Mente</title>
<style>
:root{
  --bg:#15132b;
  --pad:#242047;
  --pad-line:#3d3870;
  --ink:#fff4dc;
  --muted:#9d98d0;
  --danger:#ff4d5e;
  --violet:#a98bff;
  --violet-deep:#6f54c9;
  --gold:#ffc247;
}
html{
  box-sizing:border-box;height:100%;min-height:100vh;min-height:100dvh;background:var(--bg);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  scroll-padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;height:100%;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
#app{
  height:100%;min-height:100vh;min-height:100dvh;display:grid;gap:10px;
  padding:8px max(10px,env(safe-area-inset-right)) 14px max(10px,env(safe-area-inset-left));
  grid-template-columns:1fr 1fr;
  grid-template-rows:minmax(0,1fr) auto;
  grid-template-areas:"stage stage" "padL padR";
}
#stage{
  grid-area:stage;min-width:0;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;
  border-radius:16px;overflow:hidden;
  background:
    radial-gradient(ellipse 60% 42% at 50% 34%, rgba(169,139,255,.12), transparent 70%),
    radial-gradient(ellipse 50% 35% at 85% 90%, rgba(255,194,71,.06), transparent 70%),
    var(--bg);
}
#stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;z-index:0;
  background-image:
    radial-gradient(1.6px 1.6px at 8% 16%, var(--muted), transparent),
    radial-gradient(1.2px 1.2px at 22% 7%, var(--muted), transparent),
    radial-gradient(1.6px 1.6px at 78% 12%, var(--muted), transparent),
    radial-gradient(1.2px 1.2px at 92% 22%, var(--muted), transparent),
    radial-gradient(1.2px 1.2px at 15% 88%, var(--muted), transparent),
    radial-gradient(1.6px 1.6px at 88% 85%, var(--muted), transparent),
    radial-gradient(1.2px 1.2px at 60% 92%, var(--muted), transparent),
    radial-gradient(1.2px 1.2px at 40% 6%, var(--muted), transparent);
  background-repeat:no-repeat;
}
#frame{
  position:relative;z-index:1;max-width:100%;max-height:100%;aspect-ratio:20/11;margin:auto;
  border-radius:14px;background:#000;
  box-shadow:
    0 0 0 1.5px var(--pad-line),
    0 0 46px -8px rgba(169,139,255,.5),
    inset 0 0 40px rgba(0,0,0,.6);
}
#frame::before,#frame::after{
  content:"";position:absolute;width:20px;height:20px;pointer-events:none;opacity:.85;
}
#frame::before{top:-1.5px;left:-1.5px;border-top:2px solid var(--gold);border-left:2px solid var(--gold);border-radius:10px 0 0 0}
#frame::after{bottom:-1.5px;right:-1.5px;border-bottom:2px solid var(--gold);border-right:2px solid var(--gold);border-radius:0 0 10px 0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;border-radius:14px}
#rot{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:13px;color:var(--muted);pointer-events:none;z-index:2}
#bar{position:absolute;top:4px;left:4px;display:flex;gap:6px;z-index:3}
.mini{
  height:36px;min-width:36px;padding:0 13px;border-radius:18px;
  border:1px solid var(--pad-line);
  background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(0,0,0,.14)), var(--pad);
  color:var(--ink);font:inherit;font-size:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
}
.mini:active{background:var(--pad-line);transform:translateY(1px);box-shadow:inset 0 2px 5px rgba(0,0,0,.45)}
#padL{grid-area:padL;display:flex;align-items:flex-end;justify-content:flex-start}
#padR{grid-area:padR;display:flex;align-items:flex-end;justify-content:flex-end}
#dpad{
  display:flex;width:190px;height:88px;border-radius:44px;overflow:hidden;
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.28)), var(--pad);
  border:2px solid var(--pad-line);touch-action:none;
  box-shadow:0 5px 16px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
}
#dpad div{flex:1;display:flex;align-items:center;justify-content:center;font-size:34px;pointer-events:none;transition:background .08s}
#dpad div.on{background:var(--violet);box-shadow:inset 0 0 16px rgba(169,139,255,.65)}
#jump{
  width:100px;height:88px;border-radius:44px;
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.28)), var(--pad);
  border:2px solid var(--pad-line);
  color:var(--ink);font-size:30px;display:flex;align-items:center;justify-content:center;touch-action:none;
  box-shadow:0 5px 16px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
}
#jump.on{background:var(--danger);border-color:var(--danger);box-shadow:inset 0 0 18px rgba(255,77,94,.7),0 0 20px rgba(255,77,94,.5)}
.inmenu #padL,.inmenu #padR,.inmenu #bar,.inmenu #rot{visibility:hidden}

#menu{
  position:absolute;inset:0;background:var(--bg);z-index:5;overflow-y:auto;touch-action:pan-y;
  display:none;flex-direction:column;justify-content:center;align-items:stretch;padding:8px 6px;
}
#menu h1{margin:0 0 6px;font-size:28px;letter-spacing:.2px;text-align:center;text-shadow:0 0 20px rgba(169,139,255,.4),0 0 2px rgba(255,244,220,.3)}
#menu p{margin:0 auto 14px;font-size:15px;color:var(--muted);line-height:1.45;text-align:center;max-width:460px;white-space:pre-line}
#btns{display:grid;gap:8px;max-width:360px;width:100%;margin:0 auto}
.card{
  display:block;width:100%;text-align:center;
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.14)), var(--pad);
  border:1.5px solid var(--pad-line);
  border-radius:14px;padding:13px 14px;color:var(--ink);font:inherit;font-size:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.4);
}
.card.main{
  background:linear-gradient(160deg, #c9b5ff, var(--violet) 55%, var(--violet-deep));
  border-color:var(--violet);color:#15132b;font-weight:bold;
  box-shadow:0 0 0 1px rgba(169,139,255,.5), 0 6px 22px -4px rgba(169,139,255,.6);
  animation:pulseGlow 2.6s ease-in-out infinite;
}
.card:active{filter:brightness(1.15);transform:scale(.98)}
@keyframes pulseGlow{
  0%,100%{box-shadow:0 0 0 1px rgba(169,139,255,.5),0 6px 22px -4px rgba(169,139,255,.55)}
  50%{box-shadow:0 0 0 1px rgba(169,139,255,.75),0 6px 32px -2px rgba(169,139,255,.9)}
}
@media (prefers-reduced-motion:reduce){.card.main{animation:none}}
@media (orientation:landscape){
  #app{
    grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr);
    grid-template-areas:"padL stage padR";padding-bottom:10px;
  }
  #rot{display:none}
  #dpad{width:160px;height:78px;border-radius:39px}
  #jump{width:88px;height:78px;border-radius:39px}
  #menu h1{font-size:24px}
  #menu p{margin-bottom:10px;font-size:14px}
  .card{padding:10px 14px}
}
</style>
</head>
<body class="inmenu">
<div id="app" class="inmenu">
  <div id="stage">
    <div id="frame"><canvas id="c"></canvas></div>
    <div id="bar"><button class="mini" id="bMenu">☰</button><button class="mini" id="bAd">🎬 Anúncio</button><button class="mini" id="bVoice">🔊</button></div>
    <div id="rot">Dica: roda o telemóvel para jogares deitado.</div>
    <div id="menu"><h1 id="mTitle"></h1><p id="mText"></p><div id="btns"></div></div>
  </div>
  <div id="padL"><div id="dpad"><div id="bl">◀</div><div id="br">▶</div></div></div>
  <div id="padR"><div id="jump">▲</div></div>
</div>
<script src="game.js"></script>
</body>
</html>
