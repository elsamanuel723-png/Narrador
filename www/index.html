<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>O Narrador Mente</title>
<style>
/* Ecrã de carregamento (aparece logo, antes de o jogo acabar de carregar) */
#splash{position:fixed;inset:0;z-index:99999;background:#fff;color:#1b2a4a;
  font-family:"Arial Rounded MT Bold","Arial Rounded MT","Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  transition:opacity .35s ease;overflow:hidden}
#splash.out{opacity:0;pointer-events:none}
#splash .studio{position:absolute;top:5%;right:3%;font-size:clamp(9px,2.6vh,16px);font-weight:900;letter-spacing:.5px}
#splash .title{position:absolute;left:0;right:0;top:41%;transform:translateY(-50%);text-align:center;
  font-weight:900;font-size:min(23vh,11vw);line-height:1;letter-spacing:.01em;white-space:nowrap;
  -webkit-text-stroke:.03em #1b2a4a}
#splash .bar{position:absolute;left:50%;top:71%;transform:translateX(-50%);width:min(45vw,70vh);height:max(14px,5vh);
  border:max(2px,.7vh) solid #1b2a4a;background:#fff;box-sizing:border-box}
#splash .fill{height:100%;width:0;background:#1b2a4a;animation:spfill 2.6s cubic-bezier(.2,.7,.3,1) forwards}
#splash.done .fill{animation:none;width:100%;transition:width .25s ease}
@keyframes spfill{from{width:0}to{width:88%}}
body{margin:0;background:#fff}
</style>
<link rel="stylesheet" href="style.css">
</head>
<body class="inmenu">
<div id="splash"><div class="studio">GHOST STUDIO</div><div class="title">O NARRADOR</div><div class="bar"><div class="fill"></div></div></div>
<div id="app" class="inmenu">
  <div id="stage">
    <div id="frame"><canvas id="c"></canvas></div>
    <div id="bar"><button class="mini" id="bMenu">☰</button><button class="mini" id="bAd">🎬 Anúncio</button><button class="mini" id="bVoice">🔊</button><button class="mini" id="bOptions">⚙️</button></div>
    <button id="bPause" aria-label="Pausa"><i></i><i></i></button>
    <div id="rot"></div>
    <div id="toast"></div>
    <div id="menu"><h1 id="mTitle"></h1><p id="mText"></p><div id="btns"></div></div>
  </div>
  <div id="padL"><div id="dpad"><div id="bl">◀</div><div id="br">▶</div></div></div>
  <div id="padR"><div id="jump">▲</div></div>
</div>
<div id="portraitNote">↻ Roda o telemóvel para jogares na horizontal.</div>
<script>
(function(){
  var t0=Date.now(),sp=document.getElementById("splash"),hidden=false;
  function hide(){
    if(hidden)return;hidden=true;
    var wait=Math.max(0,900-(Date.now()-t0));   /* mostra pelo menos ~0,9 s para não piscar */
    setTimeout(function(){
      sp.className="done";
      setTimeout(function(){sp.className="done out";setTimeout(function(){if(sp.parentNode)sp.parentNode.removeChild(sp);},400);},280);
    },wait);
  }
  /* deixa o ecrã de carregamento pintar antes de carregar o jogo (que é pesado) */
  requestAnimationFrame(function(){setTimeout(function(){
    var s=document.createElement("script");s.src="game.js";
    s.onload=hide;s.onerror=hide;document.body.appendChild(s);
  },40);});
})();
</script>
</body>
</html>
